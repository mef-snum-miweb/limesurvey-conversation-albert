name: Release plugin ZIP

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la cohérence tag ↔ config.xml
        run: |
          CFG_VER=$(grep -oP '(?<=<version>)[0-9]+\.[0-9][^<]*' config.xml | head -1)
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$CFG_VER" != "$TAG_VER" ]; then
            echo "::error::Tag $TAG_VER ≠ config.xml version $CFG_VER — bumpez config.xml AVANT de tagger."
            exit 1
          fi

      - name: Build ZIP (dossier racine = nom du plugin)
        run: git archive --format=zip --prefix=ConversationIA/ -o ConversationIA.zip HEAD

      - name: Create release + attach ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ConversationIA.zip --title "$GITHUB_REF_NAME" --generate-notes
